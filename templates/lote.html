<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reportes generados</title>
<style>
  body { margin: 0; background: #f3f2ee; color: #0b0b0b; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; padding: 24px 16px; }
  main { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 18px; }
  .item { background: #fcfcfb; border: 1px solid #e1e0d9; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .item a { color: #2a78d6; font-weight: 600; }
  .error { color: #a8211f; font-size: 14px; margin-top: 4px; }
  .volver { display: inline-block; margin-top: 10px; color: #2a78d6; }
</style>
</head>
<body>
<main>
  <h1>Reportes generados</h1>
  {% for nombre, identificador, error in resultados %}
  <div class="item">
    {% if identificador %}<a href="{{ url_for('ver_reporte', identificador=identificador) }}">{{ nombre }}</a> · ver reporte
    {% else %}<b>{{ nombre }}</b><div class="error">No se pudo analizar: {{ error }}</div>{% endif %}
  </div>
  {% endfor %}
  <a class="volver" href="{{ url_for('inicio') }}">Analizar otros archivos</a>
</main>
</body>
</html>
